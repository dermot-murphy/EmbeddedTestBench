# action.yml
# =============================================================================
# TestBench Bench Runner — GitHub Action (composite)
# =============================================================================
#
# Runs one or more bench test specifications with `benchtools run`, annotates
# the failures inline, writes a job summary, and publishes JUnit XML for the
# usual test reporters.
#
# Minimal usage — the simulated bench, which needs no hardware:
#
#   - uses: dermot-murphy/EmbeddedTestBench@v1
#     with:
#       specs: specs/sensor_commands.yaml
#       bench: benches/simulated_bench.yaml
#
# `simulate: 'true'` also replaces every instrument with its simulator, but it
# supplies no bench options - so a specification that checks firmware against a
# manifest needs the simulated *bench*, which carries those manifest paths.
#
# Against a real bench on a self-hosted runner:
#
#   - uses: dermot-murphy/EmbeddedTestBench@v1
#     id: bench
#     with:
#       specs: |
#         specs/sensor_bringup.yaml
#         specs/sensor_commands.yaml
#       bench:    benches/lab1.yaml
#       simulate: 'false'
#       junit:    results/bench.xml
#       markdown: results/bench.md
#
#   - run: echo "failed=${{ steps.bench.outputs.failed }}"
#
# A run whose instruments were simulated is reported as simulated — in the
# annotations, in the job summary and in every report file. That disclosure is
# a requirement of the tool (TB-SYS2-016), not a nicety, so this action does
# not offer a way to turn it off.
# =============================================================================

name:        'TestBench Bench Runner'
description: 'Run bench test specifications against real or simulated instruments and report the results'
author:      'Dermot Murphy'

branding:
  icon:  'activity'
  color: 'blue'

# ---------------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------------

inputs:

  specs:
    description: >-
      Newline- or space-separated specification files to run (.yaml or .json).
      Globs are expanded by the action.
    required: true

  bench:
    description: >-
      Bench configuration file. Required unless simulate is true.
    required: false
    default: ''

  simulate:
    description: >-
      Replace every instrument with its simulator. Use this to run a
      specification on a hosted runner with no hardware attached.
    required: false
    default: 'true'

  simulate-driver:
    description: >-
      Driver used for simulated instruments whose alias the specification does
      not declare. Passed through to `benchtools run --simulate-driver`.
    required: false
    default: ''

  junit:
    description: 'Path for the JUnit XML report. Empty to skip.'
    required: false
    default: ''

  markdown:
    description: 'Path for the markdown report. Empty to skip.'
    required: false
    default: ''

  json:
    description: >-
      Path for the full JSON result record. When empty the action still writes
      one to the runner temp directory, because it reads the records to produce
      annotations and outputs. With more than one specification benchtools
      numbers the files - `bench_1.json`, `bench_2.json` - and the action reads
      all of them.
    required: false
    default: ''

  annotations:
    description: >-
      Emit ::error / ::warning annotations for failed and errored cases.
    required: false
    default: 'true'

  summary:
    description: >-
      Write a table of the results to the job summary.
    required: false
    default: 'true'

  fail-on:
    description: >-
      What causes the action to exit 1.
      'failure' — any failed or errored case (default).
      'error'   — only cases the bench could not measure, not cases the target
                  failed. Use this to gate on bench health rather than on the
                  target under test.
      'never'   — always exit 0.
    required: false
    default: 'failure'

  stop-on-error:
    description: 'Abandon the remaining tests after the first error.'
    required: false
    default: 'false'

  python-version:
    description: 'Python version used to run benchtools.'
    required: false
    default: '3.11'

  extras:
    description: >-
      Optional-dependency extras installed with benchtools, comma-separated.
      The default covers YAML specifications and serial instruments.
    required: false
    default: 'spec,serial'

  working-directory:
    description: 'Directory the specifications are resolved against.'
    required: false
    default: '.'

  verbose:
    description: 'Increase benchtools logging.'
    required: false
    default: 'false'

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

outputs:

  status:
    description: >-
      Overall result across every specification: PASS, FAIL or ERROR.
    value: ${{ steps.bench.outputs.status }}

  total:
    description: 'Number of test cases run, across every specification.'
    value: ${{ steps.bench.outputs.total }}

  passed:
    description: 'Number of cases that passed.'
    value: ${{ steps.bench.outputs.passed }}

  failed:
    description: 'Number of cases whose target did not meet an expectation.'
    value: ${{ steps.bench.outputs.failed }}

  errored:
    description: 'Number of cases the bench could not measure.'
    value: ${{ steps.bench.outputs.errored }}

  skipped:
    description: 'Number of cases skipped.'
    value: ${{ steps.bench.outputs.skipped }}

  simulated:
    description: 'true when any instrument in the run was simulated.'
    value: ${{ steps.bench.outputs.simulated }}

  json-file:
    description: >-
      Comma-separated paths to the JSON result records - one per specification.
    value: ${{ steps.bench.outputs.json_file }}

# ---------------------------------------------------------------------------
# Implementation — composite action
# ---------------------------------------------------------------------------
#
# Design notes
# ------------
# * Composite rather than Docker: no image pull on every run, and a self-hosted
#   runner with instruments attached keeps its own device access.
# * benchtools is installed from github.action_path, so the action runs exactly
#   the version the caller pinned.
# * The runner always writes a JSON record; annotations, outputs and the job
#   summary are read from it rather than scraped from stdout.
# * Failure and error are kept apart all the way to the exit code, because they
#   mean different things: a failure is the target's, an error is the bench's.
# ---------------------------------------------------------------------------

runs:
  using: 'composite'

  steps:

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install benchtools
      shell: bash
      run: |
        set -eu
        extras='${{ inputs.extras }}'
        if [ -n "$extras" ]; then
          pip install --quiet "${{ github.action_path }}[$extras]"
        else
          pip install --quiet "${{ github.action_path }}"
        fi
        benchtools --version

    - name: Run bench specifications
      id: bench
      shell: python
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_SPECS:           ${{ inputs.specs }}
        INPUT_BENCH:           ${{ inputs.bench }}
        INPUT_SIMULATE:        ${{ inputs.simulate }}
        INPUT_SIMULATE_DRIVER: ${{ inputs.simulate-driver }}
        INPUT_JUNIT:           ${{ inputs.junit }}
        INPUT_MARKDOWN:        ${{ inputs.markdown }}
        INPUT_JSON:            ${{ inputs.json }}
        INPUT_ANNOTATIONS:     ${{ inputs.annotations }}
        INPUT_SUMMARY:         ${{ inputs.summary }}
        INPUT_FAIL_ON:         ${{ inputs.fail-on }}
        INPUT_STOP_ON_ERROR:   ${{ inputs.stop-on-error }}
        INPUT_VERBOSE:         ${{ inputs.verbose }}
      run: |
        import glob
        import json
        import os
        import subprocess
        import sys
        from pathlib import Path


        def value(key):
            return os.environ.get(key, "").strip()


        def flag(key):
            return value(key).lower() in ("true", "1", "yes", "on")


        temp = Path(os.environ.get("RUNNER_TEMP", "."))

        specs = []
        for token in value("INPUT_SPECS").replace("\n", " ").split():
            matches = sorted(glob.glob(token))
            specs.extend(matches or [token])
        if not specs:
            print("::error::No specification files given")
            sys.exit(1)

        json_path = value("INPUT_JSON") or str(temp / "benchtools_result.json")
        Path(json_path).parent.mkdir(parents=True, exist_ok=True)
        # A record left by an earlier step would otherwise be read as this
        # run's result if benchtools failed before writing one.
        try:
            os.remove(json_path)
        except OSError:
            pass

        argv = [sys.executable, "-m", "benchtools", "run"] + specs
        argv += ["--json", json_path]

        if flag("INPUT_SIMULATE"):
            argv.append("--simulate")
        elif not value("INPUT_BENCH"):
            print("::error::bench is required when simulate is false")
            sys.exit(1)

        if value("INPUT_BENCH"):
            argv += ["--bench", value("INPUT_BENCH")]
        if value("INPUT_SIMULATE_DRIVER"):
            argv += ["--simulate-driver", value("INPUT_SIMULATE_DRIVER")]
        for key, option in (("INPUT_JUNIT", "--junit"), ("INPUT_MARKDOWN", "--markdown")):
            if value(key):
                Path(value(key)).parent.mkdir(parents=True, exist_ok=True)
                argv += [option, value(key)]
        if flag("INPUT_STOP_ON_ERROR"):
            argv.append("--stop-on-error")
        if flag("INPUT_VERBOSE"):
            argv.append("--verbose")

        print("Running: %s" % " ".join(argv), flush=True)
        completed = subprocess.run(argv)

        # The runner's own exit code says whether it could run at all; the
        # records say what happened. benchtools writes one file per
        # specification, numbering them <stem>_1, <stem>_2 ... when there is
        # more than one, so the exact path is only written for a single spec.
        wanted = Path(json_path)
        found = [wanted] if wanted.exists() else []
        if not found:
            numbered = []
            for candidate in wanted.parent.glob("%s_*%s" % (wanted.stem, wanted.suffix)):
                tail = candidate.stem[len(wanted.stem) + 1:]
                if tail.isdigit():
                    numbered.append((int(tail), candidate))
            found = [path for _, path in sorted(numbered)]

        records = []
        for path in found:
            try:
                records.append(json.loads(path.read_text()))
            except (OSError, ValueError) as exc:
                print("::error::Could not read result record %s: %s" % (path, exc))

        # No record at all means the run did not start, which is an error
        # however fail-on is set.
        if not records:
            print("::error::benchtools produced no result record "
                  "(exit code %d)" % completed.returncode)
            sys.exit(1)

        totals = {key: 0 for key in
                  ("total", "passed", "failed", "errored", "skipped")}
        for record in records:
            for key in totals:
                totals[key] += record.get("totals", {}).get(key, 0)

        simulated = any(record.get("simulated") for record in records)
        statuses = [record.get("status", "ERROR") for record in records]
        if totals["errored"] or "ERROR" in statuses:
            status = "ERROR"
        elif totals["failed"] or "FAIL" in statuses:
            status = "FAIL"
        else:
            status = "PASS"

        def titled(record, name):
            # With one specification the suite name is noise; with several it
            # is the only way to tell which one a failure came from.
            if len(records) == 1:
                return name
            return "%s - %s" % (record.get("suite", "?"), name)

        # ── Annotations ──────────────────────────────────────────────────────
        if flag("INPUT_ANNOTATIONS"):
            for record in records:
                source = record.get("spec_source", "")
                if record.get("setup_error"):
                    print("::error file=%s::Bench setup failed: %s"
                          % (source, record["setup_error"]))
                for case in record.get("cases", []):
                    name = titled(record, case.get("name", "(unnamed)"))
                    if case.get("status") == "ERROR":
                        detail = case.get("error") or "the bench could not make the measurement"
                        print("::error file=%s,title=%s::%s" % (source, name, detail))
                    elif case.get("status") == "FAIL":
                        reasons = []
                        for step in case.get("steps", []):
                            for measurement in step.get("measurements", []):
                                if measurement.get("status") == "FAIL":
                                    reasons.append(
                                        "%s = %s (expected %s)"
                                        % (measurement.get("name", "?"),
                                           measurement.get("value"),
                                           measurement.get("limit", "?")))
                        detail = "; ".join(reasons) or case.get("error") or "expectation not met"
                        print("::error file=%s,title=%s::%s" % (source, name, detail))
            if simulated:
                print("::warning::This run was simulated. It shows that the "
                      "specification executes, not that the instruments behave "
                      "as modelled.")

        # ── Job summary ──────────────────────────────────────────────────────
        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        if flag("INPUT_SUMMARY") and summary_path:
            lines = []
            if len(records) > 1:
                lines += [
                    "## Bench run — %d specifications" % len(records),
                    "",
                    "| Result | Total | Passed | Failed | Errored | Skipped |",
                    "|---|---|---|---|---|---|",
                    "| **%s** | %d | %d | %d | %d | %d |" % (
                        status, totals["total"], totals["passed"],
                        totals["failed"], totals["errored"], totals["skipped"]),
                    "",
                ]
            for record in records:
                record_totals = record.get("totals", {})
                lines += [
                    "## %s" % record.get("suite", "(unnamed suite)"),
                    "",
                    "| Field | Value |",
                    "|---|---|",
                    "| Result | **%s** |" % record.get("status", "?"),
                    "| Bench | %s |" % record.get("bench", "?"),
                    "| Specification | %s |" % record.get("spec_source", "?"),
                    "| Simulated | %s |" % ("**yes**" if record.get("simulated") else "no"),
                    "| Duration | %.2f s |" % float(record.get("duration_s", 0.0) or 0.0),
                    "",
                    "| Total | Passed | Failed | Errored | Skipped |",
                    "|---|---|---|---|---|",
                    "| %d | %d | %d | %d | %d |" % (
                        record_totals.get("total", 0), record_totals.get("passed", 0),
                        record_totals.get("failed", 0), record_totals.get("errored", 0),
                        record_totals.get("skipped", 0)),
                    "",
                ]
                instruments = record.get("instruments", {})
                if instruments:
                    lines += ["### Instruments", "",
                              "| Alias | Driver | Identity |", "|---|---|---|"]
                    for alias, info in instruments.items():
                        identity = str(info.get("identity", "")).splitlines()
                        lines.append("| %s | %s | %s |"
                                     % (alias, info.get("driver", "?"),
                                        identity[0] if identity else ""))
                    lines.append("")
                cases = record.get("cases", [])
                if cases:
                    lines += ["### Cases", "",
                              "| Case | Requirement | Result | Duration |",
                              "|---|---|---|---|"]
                    for case in cases:
                        lines.append("| %s | %s | %s | %.3f s |"
                                     % (case.get("name", ""),
                                        case.get("requirement", ""),
                                        case.get("status", ""),
                                        float(case.get("duration_s", 0.0) or 0.0)))
                    lines.append("")
            if simulated:
                lines += ["> Instruments in this run were simulated.", ""]
            with open(summary_path, "a", encoding="utf-8") as handle:
                handle.write("\n".join(lines))

        # ── Outputs ──────────────────────────────────────────────────────────
        output_path = os.environ.get("GITHUB_OUTPUT")
        if output_path:
            with open(output_path, "a", encoding="utf-8") as handle:
                handle.write("status=%s\n" % status)
                for key in ("total", "passed", "failed", "errored", "skipped"):
                    handle.write("%s=%d\n" % (key, totals[key]))
                handle.write("simulated=%s\n" % str(simulated).lower())
                handle.write("json_file=%s\n" % ",".join(str(p) for p in found))

        # ── Exit code ────────────────────────────────────────────────────────
        fail_on = value("INPUT_FAIL_ON").lower() or "failure"
        errored = totals["errored"]
        failed = totals["failed"]

        print("%s: %d passed, %d failed, %d errored, %d skipped across %d "
              "specification(s)" % (status, totals["passed"], failed, errored,
                                    totals["skipped"], len(records)))

        if fail_on == "never":
            sys.exit(0)
        if fail_on == "error":
            sys.exit(1 if errored else 0)
        sys.exit(1 if (failed or errored) else 0)
