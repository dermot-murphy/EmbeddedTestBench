[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tek3014b"
version = "1.0.0"
description = "Ethernet driver for the Tektronix TDS3014B oscilloscope, with no mandatory VISA dependency"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["tektronix", "tds3014b", "oscilloscope", "vxi11", "scpi", "lxi", "test-equipment"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

# No mandatory runtime dependencies: the VXI-11 transport is implemented
# against the Python standard library only.
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.3"]
visa = ["pyvisa>=1.11", "pyvisa-py>=0.5"]
test = ["pytest>=7.0", "pytest-cov>=4.0", "matplotlib>=3.3", "pyvisa>=1.11", "pyvisa-py>=0.5"]

[project.scripts]
tek3014b = "tek3014b.cli:main"

[tool.setuptools.packages.find]
include = ["tek3014b*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:pyvisa_py.*"]
