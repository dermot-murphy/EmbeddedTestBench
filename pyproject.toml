[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "benchtools"
version = "0.01.0000"
description = "Bench test tooling: instrument, debug-probe and BLE-dongle drivers, analysis and a declarative test runner, with no mandatory VISA or vendor dependency"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
    "test-equipment", "oscilloscope", "tektronix", "tds3014b",
    "vxi11", "scpi", "lxi", "instrument-control", "test-automation",
    "jlink", "segger", "gdb", "rtt", "swo", "itm", "cortex-m", "embedded",
    "bluetooth", "ble", "nordic", "nrf52840", "advertising", "nus", "serial",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Debuggers",
]

# No mandatory runtime dependencies. VXI-11 and GDB/MI are implemented against the
# standard library, so a driver works on a bare Python install. The J-Link driver
# needs two *executables* (the J-Link GDB Server and a GDB), not Python packages.
dependencies = []

[project.optional-dependencies]
# Human-authored YAML test specifications and bench configurations. JSON works
# with no extra package.
spec = ["pyyaml>=5.1"]
# Host-side plots.
plot = ["matplotlib>=3.10.9"]
# Route the instrument link through a VISA library instead of the built-in one.
visa = ["pyvisa>=1.11", "pyvisa-py>=0.5"]
# Serial ports: the BLE dongle's USB CDC link, and RS-232 instruments.
serial = ["pyserial>=3.4"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyyaml>=5.1",
    "matplotlib>=3.10.9",
    "pyvisa>=1.11",
    "pyvisa-py>=0.5",
    "pyserial>=3.4",
]

[project.scripts]
benchtools = "benchtools.cli:main"

[tool.setuptools.packages.find]
include = ["benchtools*"]

# The test run viewer's page (#137): HTML, JavaScript and CSS served as files.
[tool.setuptools.package-data]
"benchtools.viewer" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/bench exercises real instruments and runs only when named:
#     BENCHTOOLS_TTI1604=/dev/ttyUSB0 python -m pytest tests/bench/tti1604 -v
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "bench"]
markers = ["bench: needs a real instrument attached, named by an environment variable"]
filterwarnings = ["ignore::UserWarning:pyvisa_py.*"]

# ---------------------------------------------------------------------------
# pylint
# ---------------------------------------------------------------------------
# Run by .github/workflows/lint.yml through scripts/lint.py, which also
# compares the findings against .pylint-baseline.json so the job fails on new
# ones rather than on the debt that was there when the check was introduced.
#
# The same rule as the C side (ETB-STY-001): a rule the project has decided
# against is switched off here and said so; a rule the project accepts but has
# not yet met stays on and goes in the baseline.

[tool.pylint.main]
# One job, not one per core. pylint's duplicate-code check compares files
# against each other, so what it finds depends on how the files were split
# across workers - and a gate that answers differently on a four-core laptop
# and a runner is not a gate.
jobs = 1
persistent = false

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    # Not adopted. The package uses %-formatting throughout - 645 occurrences,
    # applied consistently, and readable. Converting them would be churn
    # across every module in exchange for nothing a reader gains.
    "consider-using-f-string",

    # Not adopted, and the opposite of what this package does deliberately.
    # Optional dependencies (pyyaml, matplotlib, pyvisa, pyserial) are imported
    # inside the function that needs them, so a driver works on a bare Python
    # install and a missing extra fails where it is used with a message naming
    # it. Hoisting those imports to module level would break that.
    "import-outside-toplevel",

    # Not adopted, because it cannot be enforced. duplicate-code compares
    # files against each other, and which pairs it reports depends on the
    # order the files are walked in - so the same tree gives different answers
    # on different machines. Two runs of this repository, one local and one on
    # a GitHub runner, found the same number of similarities and named
    # different pairs. A rule whose output is not reproducible cannot gate a
    # build, and baselining it only moves the flapping into the baseline.
    #
    # What it was pointing at is real and is recorded as debt in ETB-ANA-001
    # §6.13 rather than silenced: five driver CLIs carry the same `main()`
    # boilerplate - parse, set the logging level, dispatch - and that belongs
    # in one helper. Factoring it out is its own change, not a CI ticket's.
    "duplicate-code",

    # Not adopted. Instrument simulators hold state that `reset()` establishes
    # and the command handlers replace; `__init__` calls `reset()`, which
    # pylint does not follow. Listing every field twice to satisfy the check
    # would make the reset path easier to get wrong, not harder.
    "attribute-defined-outside-init",
]

[tool.pylint.basic]
# Method names that mirror an instrument's own command spelling. The TDS3014B
# simulator dispatches on the SCPI command it received, so `_cmd_ALLEV_Q` is
# the header `ALLEV?` and renaming it to snake_case would hide the thing the
# method exists to match.
method-rgx = "^(([a-z_][a-z0-9_]{2,})|(_cmd_[A-Z0-9_]+))$"

# Locals that are constants in everything but scope.
variable-rgx = "^(([a-z_][a-z0-9_]{1,})|([A-Z_][A-Z0-9_]+))$"
