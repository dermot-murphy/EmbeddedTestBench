# Publish the home page to the gh-pages branch, served by GitHub Pages (#184).
#
# The home page is a generated output, never edited by hand (ETB-SUP8-001
# §5.7). scripts/publish_docs.py writes README.md (the logo, the README's
# introduction and links to the wiki, the latest release and the system
# qualification report), _config.yml and the logo into a checkout of gh-pages.
# Files it does not write are left in place, so the branch can carry other
# generated content later. GitHub Pages serves the branch from its root with the
# legacy (branch) build.
#
# It runs on push to main - under gitflow, main is the released state - and on
# workflow_dispatch from main, and pushes only if something changed. The
# `dry_run` input generates and reports the change without pushing.
#
# The push uses GITHUB_TOKEN, raised to contents: write for this job only.

name: pages

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/brand/**"
      - "scripts/publish_docs.py"
      - ".github/workflows/pages_publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and show the change, but do not push"
        type: boolean
        default: false

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-home:
    name: Publish home page
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the home page
        run: python scripts/publish_docs.py home site --ref main

      - name: Commit and push if anything changed
        env:
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        working-directory: site
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "No change: the home page is already up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: not pushed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Regenerate the home page from main at ${SHA:0:7}" \
                     -m "Generated by .github/workflows/pages_publish.yml; not edited by hand."
          git push
