# C coding-standard check.
#
# Enforces the mechanically checkable part of TB-STD-002 (Embedded C Coding
# Standard) and TB-STY-001 (Embedded C Style Guide) over the firmware this
# project owns. The nRF5 SDK and the SoftDevice are vendor sources and are out
# of scope (TB-STD-002 §1.3), so they are not in the include patterns.
#
# The run is baselined: `.cstylecheck-baseline.json` records the violations
# present when the check was introduced, so the job fails on *new* ones. The
# baseline is debt, not absolution — see TB-ANA-001 §6.12 for what is in it and
# what closing it involves.
#
# Pinned to v1.5.1, not the newest v1.6.0: v1.6.0 writes its version banner into
# the results file its own action then parses as JSON, so the action fails after
# the check itself has passed. See TB-ACQ4-001 §7. The baseline is written by
# the pinned version and must be regenerated if that pin moves.

name: style

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cstylecheck:
    name: Embedded C standard
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run CStyleCheck
        id: cstylecheck
        uses: dermot-murphy/CStyleCheck@v1.5.1
        with:
          config: .cstylecheck.yml
          include: |
            firmware/nordic_dongle/src/**/*.c
            firmware/nordic_dongle/src/**/*.h
            firmware/nordic_dongle/include/**/*.h
          baseline-file: .cstylecheck-baseline.json
          fail-on: error

      # The dongle firmware's host unit tests (#111), in their own step so that
      # their module aliases cannot relax the check on the firmware itself.
      # test/support/include/ holds stand-ins for nRF5 SDK headers, which keep
      # the SDK's names and are vendor API, outside TB-STD-002 (section 1.3).
      # The tests entered the check clean: no baseline, and any finding fails.
      - name: Run CStyleCheck (dongle unit tests)
        id: cstylecheck-dongle-tests
        uses: dermot-murphy/CStyleCheck@v1.5.1
        with:
          config: .cstylecheck.yml
          include: |
            firmware/nordic_dongle/test/*.c
            firmware/nordic_dongle/test/support/*.c
            firmware/nordic_dongle/test/support/*.h
          aliases: .cstylecheck-dongle-tests-aliases.txt
          exclusions: .cstylecheck-dongle-tests-exclusions.yml
          fail-on: info

      - name: Report counts
        if: always()
        run: |
          echo "errors=${{ steps.cstylecheck.outputs.errors }}"
          echo "warnings=${{ steps.cstylecheck.outputs.warnings }}"
          echo "info=${{ steps.cstylecheck.outputs.info }}"
          echo "dongle tests errors=${{ steps.cstylecheck-dongle-tests.outputs.errors }}"
          echo "dongle tests warnings=${{ steps.cstylecheck-dongle-tests.outputs.warnings }}"
          echo "dongle tests info=${{ steps.cstylecheck-dongle-tests.outputs.info }}"
