# C coding-standard check.
#
# Enforces the mechanically checkable part of ETB-STD-002 (Embedded C Coding
# Standard) and ETB-STY-001 (Embedded C Style Guide) over the firmware this
# project owns: the dongle firmware, the PICO2 Test Board firmware and the S2-LP
# kit firmware, and the host unit tests of each. The nRF5 SDK, the SoftDevice
# and the Pico SDK are vendor sources and are out of scope (ETB-STD-002 §1.3),
# so they are not in the include patterns.
#
# Two checkers, both failing on any finding, with no baseline (#379):
#
#   CStyleCheck  naming, structure and formatting (ETB-STY-001, and the parts
#                of ETB-STD-002 a pattern can see). Pinned to the exact tag
#                v1.6.1 (#229). v1.6.0 was skipped: it wrote its version banner
#                into the results file its own action parses as JSON, so every
#                run failed (dermot-murphy/CStyleCheck#439, fixed in v1.6.1).
#                See ETB-ACQ4-001 §7.
#   Cppcheck     MISRA C:2012 through its misra addon, which needs a type
#                system and control flow (ETB-STD-002 §7.4). The rule texts are
#                licensed and are not in the repository, so findings carry rule
#                numbers only. Each suppression is one rule in one file, with its
#                reason, in .cppcheck-misra-suppressions.txt, and is a row of the
#                deviation table in ETB-STD-002 §72.5.

name: style

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cstylecheck:
    name: Embedded C standard
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Run CStyleCheck
        id: cstylecheck
        uses: dermot-murphy/CStyleCheck@v1.6.1
        with:
          config: .cstylecheck.yml
          include: |
            firmware/nordic_dongle/src/**/*.c
            firmware/nordic_dongle/src/**/*.h
            firmware/nordic_dongle/include/**/*.h
          fail-on: info

      # The PICO2 Test Board firmware (PICO-NFR-006), all of it - sources,
      # headers and the host unit tests - checked in its own step so that its
      # module aliases cannot relax the check on the dongle firmware. It entered
      # the check clean, so it has no baseline and fails on any finding at all.
      - name: Run CStyleCheck (PICO2 Test Board)
        id: cstylecheck-pico
        uses: dermot-murphy/CStyleCheck@v1.6.1
        with:
          config: .cstylecheck.yml
          include: |
            firmware/pico2_test_board/src/**/*.c
            firmware/pico2_test_board/src/**/*.h
            firmware/pico2_test_board/include/**/*.h
            firmware/pico2_test_board/test/**/*.c
            firmware/pico2_test_board/test/**/*.h
          aliases: .cstylecheck-pico-aliases.txt
          exclusions: .cstylecheck-pico-exclusions.yml
          fail-on: info

      # The S2-LP kit firmware (#84), sources, headers and host unit tests, in
      # its own step for the same reason.
      - name: Run CStyleCheck (S2-LP kit firmware)
        id: cstylecheck-s2lp-kit
        uses: dermot-murphy/CStyleCheck@v1.6.1
        with:
          config: .cstylecheck.yml
          include: |
            firmware/s2lp_kit/src/**/*.c
            firmware/s2lp_kit/src/**/*.h
            firmware/s2lp_kit/include/**/*.h
            firmware/s2lp_kit/test/**/*.c
            firmware/s2lp_kit/test/**/*.h
          aliases: .cstylecheck-s2lp-kit-aliases.txt
          exclusions: .cstylecheck-s2lp-kit-exclusions.yml
          fail-on: info

      # The dongle firmware's host unit tests (#111), in their own step so that
      # their module aliases cannot relax the check on the firmware itself.
      # test/support/include/ holds stand-ins for nRF5 SDK headers, which keep
      # the SDK's names and are vendor API, outside ETB-STD-002 (section 1.3).
      - name: Run CStyleCheck (dongle unit tests)
        id: cstylecheck-dongle-tests
        uses: dermot-murphy/CStyleCheck@v1.6.1
        with:
          config: .cstylecheck.yml
          include: |
            firmware/nordic_dongle/test/*.c
            firmware/nordic_dongle/test/support/*.c
            firmware/nordic_dongle/test/support/*.h
          aliases: .cstylecheck-dongle-tests-aliases.txt
          exclusions: .cstylecheck-dongle-tests-exclusions.yml
          fail-on: info

      # MISRA C:2012 over the project's own firmware sources (src/ and include/
      # of each tree), one tree at a time so that each sees only its own
      # headers: two trees have a protocol.h. The dongle is read against the
      # stand-ins for nRF5 SDK headers in its test support, so that SDK names
      # resolve; findings inside them are suppressed as out of scope. The
      # targets are 32-bit, hence unix32. Any finding fails the step, whether
      # a MISRA rule or one of Cppcheck's own style checks.
      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes cppcheck
          cppcheck --version

      - name: MISRA C:2012 (Cppcheck)
        run: |
          set -uo pipefail
          status=0
          check() {
            tree=$1
            shift
            echo "::group::MISRA C:2012 - $tree"
            cppcheck --addon=misra --enable=style --std=c11 --platform=unix32 \
              --check-level=exhaustive --error-exitcode=1 --quiet \
              --suppressions-list=.cppcheck-misra-suppressions.txt \
              --template='::error file={file},line={line},col={column}::{id}: {message}' \
              "$@" "firmware/$tree/src" "firmware/$tree/include" || status=1
            echo "::endgroup::"
          }
          check nordic_dongle \
            -Ifirmware/nordic_dongle/include -Ifirmware/nordic_dongle/src \
            -Ifirmware/nordic_dongle/config -Ifirmware/nordic_dongle/test/support/include
          check pico2_test_board \
            -Ifirmware/pico2_test_board/include -Ifirmware/pico2_test_board/src
          check s2lp_kit \
            -Ifirmware/s2lp_kit/include -Ifirmware/s2lp_kit/src
          exit $status

      - name: Report counts
        if: always()
        run: |
          echo "errors=${{ steps.cstylecheck.outputs.errors }}"
          echo "warnings=${{ steps.cstylecheck.outputs.warnings }}"
          echo "info=${{ steps.cstylecheck.outputs.info }}"
          echo "pico errors=${{ steps.cstylecheck-pico.outputs.errors }}"
          echo "pico warnings=${{ steps.cstylecheck-pico.outputs.warnings }}"
          echo "pico info=${{ steps.cstylecheck-pico.outputs.info }}"
          echo "dongle tests errors=${{ steps.cstylecheck-dongle-tests.outputs.errors }}"
          echo "dongle tests warnings=${{ steps.cstylecheck-dongle-tests.outputs.warnings }}"
          echo "dongle tests info=${{ steps.cstylecheck-dongle-tests.outputs.info }}"
          echo "s2lp kit errors=${{ steps.cstylecheck-s2lp-kit.outputs.errors }}"
          echo "s2lp kit warnings=${{ steps.cstylecheck-s2lp-kit.outputs.warnings }}"
          echo "s2lp kit info=${{ steps.cstylecheck-s2lp-kit.outputs.info }}"
