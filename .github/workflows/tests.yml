# The Python suite.
#
# This is the workflow that makes every other check in this repository mean
# something on a pull request: the traceability check that binds the documents
# to the code, the layering test that enforces the architecture's dependency
# direction, and the driver, runner and analysis tests all live here. Until it
# existed they ran only when someone remembered to run them (ETB-ANA-001 §6.1).
#
# No hardware is required. Every instrument has a simulator, so the whole suite
# runs on a hosted runner - which is the point of ETB-SYS2-012.
#
# Coverage gates at the ETB-QA-002 target of 90%.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }}${{ matrix.os-name }})
    runs-on: ${{ matrix.runs-on }}

    # bash on every leg, Windows included (Git Bash on the hosted runner), so
    # each step is the same command wherever it runs.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        # The floor `pyproject.toml` declares, the version after it, and a
        # current release. Testing the floor is not decoration here: benchtools
        # has no mandatory runtime dependencies precisely so that a driver runs
        # on a bare Python install (CORE-NFR-001), and the bench PC that design
        # serves is the one least likely to have been rebuilt lately.
        #
        # 3.8 runs on ubuntu-22.04 because it is end-of-life and is not in the
        # tool cache for ubuntu-24.04. The other legs pin ubuntu-24.04 rather
        # than ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19 (#203):
        # a runner image change is a decision, not something that happens to us.
        # The day 3.8 stops being supportable the honest move is to raise
        # requires-python, not to drop this leg and leave the claim standing.
        include:
          - python-version: '3.8'
            runs-on: ubuntu-22.04
          - python-version: '3.9'
            runs-on: ubuntu-24.04
          - python-version: '3.12'
            runs-on: ubuntu-24.04
          # The bench PC, where every hardware run is made, runs Windows at
          # Python 3.14. Five problems up to v0.03.0000 appeared only on Windows
          # (#79, #81, #214, #305, #384; ETB-SUP9-001 9.1), so this leg runs the
          # suite there (#385). The runner is pinned by name like the others.
          # Its constraints are resolved for Windows: see etb-ci lock.
          - python-version: '3.14'
            runs-on: windows-2025
            os-name: ', Windows'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The library versions are pinned per Python in constraints/, which the
      # CI image installs too (docker/ci, #282), so a leg can be run locally
      # with the releases CI uses. Regenerate them with `etb-ci lock`.
      - name: Install
        run: pip install --quiet -c constraints/py${{ matrix.python-version }}.txt -e .[test]

      - name: Run the suite
        run: >
          python -m pytest
          --cov=benchtools --cov-report=term-missing --cov-fail-under=90
          --junitxml=results/pytest.xml

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.python-version }}
          path: results/
          if-no-files-found: warn
