# The Python suite.
#
# This is the workflow that makes every other check in this repository mean
# something on a pull request: the traceability check that binds the documents
# to the code, the layering test that enforces the architecture's dependency
# direction, and the driver, runner and analysis tests all live here. Until it
# existed they ran only when someone remembered to run them (TB-ANA-001 §6.1).
#
# No hardware is required. Every instrument has a simulator, so the whole suite
# runs on a hosted runner - which is the point of TB-SYS2-012.
#
# Coverage gates at the TB-QA-002 target of 90%.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest version tested, and a current release. A driver is meant
        # to work on a bare Python install, so testing an old one is not
        # decoration.
        #
        # pyproject.toml declares requires-python >= 3.8, which nothing here
        # verifies: 3.8 is end-of-life and not reliably available on the hosted
        # runners. So the package claims one floor and this workflow tests
        # another. Either 3.8 gets tested or the declared floor should move to
        # 3.9 - a packaging decision, raised in the ticket rather than made
        # quietly here.
        python-version: ['3.9', '3.12']

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install --quiet -e .[test]

      - name: Run the suite
        run: >
          python -m pytest
          --cov=benchtools --cov-report=term-missing --cov-fail-under=90
          --junitxml=results/pytest.xml

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: results/
          if-no-files-found: warn
