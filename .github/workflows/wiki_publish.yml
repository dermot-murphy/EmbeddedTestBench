# Publish the GitHub wiki, generated from the repository (#184).
#
# The wiki is a generated output, never edited by hand (ETB-SUP8-001 §5.8).
# scripts/publish_docs.py writes every page: Home from the README's
# introduction, one page per user guide and instrument note in docs/, one
# ASPICE-<name> page per ASPICE work product, ASPICE-Index and _Sidebar.
# Links between published documents become wiki links; every other relative
# link points at the file on main.
#
# It runs on push to main - under gitflow, main is the released state - and on
# workflow_dispatch from main. Before generating, the existing pages are
# removed, so a renamed or deleted document leaves no stale page; the result is
# committed and pushed only if something changed, and the generated pages
# carry no timestamp, so a run over unchanged documents pushes nothing.
#
# The `dry_run` input generates and reports the change without pushing. It is
# the only mode in which the workflow does anything away from main.
#
# Authentication: the default GITHUB_TOKEN cannot push to a wiki repository, so
# the push uses the repository secret WIKI_TOKEN, a personal access token of
# the repository owner's account with contents write on this repository. The
# token is paired with that account's user name: CStyleCheck's wiki workflow
# records that GitHub answers HTTP 403 when "x-access-token" is used as the
# user name against a wiki. The credentials go in git's credential store, so
# the token never appears in a remote URL or a process listing.

name: wiki

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/publish_docs.py"
      - ".github/workflows/wiki_publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and show the change, but do not push"
        type: boolean
        default: false

concurrency:
  group: wiki-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-wiki:
    name: Publish wiki
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || inputs.dry_run

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Clone the wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::The WIKI_TOKEN secret is not set (see the header of this workflow)."
            exit 1
          fi
          git config --global credential.helper store
          printf 'https://%s:%s@github.com\n' "$OWNER" "$WIKI_TOKEN" > ~/.git-credentials
          git clone "https://github.com/${REPO}.wiki.git" wiki

      - name: Generate the pages
        run: python scripts/publish_docs.py wiki wiki --clean --ref main

      - name: Commit and push if anything changed
        env:
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        working-directory: wiki
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "No change: the wiki is already up to date."
            echo "No change: the wiki is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat
          {
            echo "## Wiki pages changed"
            echo ""
            echo '```'
            git diff --cached --name-status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: not pushed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Regenerate the wiki from main at ${SHA:0:7}" \
                     -m "Generated by .github/workflows/wiki_publish.yml; not edited by hand."
          git push
