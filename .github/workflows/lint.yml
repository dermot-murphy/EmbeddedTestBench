# pylint over the Python this project owns.
#
# The C source has been checked mechanically since #12; the 23 611 lines of
# Python were checked by nothing but the test suite. This closes that.
#
# The configuration lives in pyproject.toml under [tool.pylint], where each
# rule the project has decided against is switched off with its reason. What is
# left is run through scripts/lint.py, which fails on any finding. There is no
# baseline: #379 fixed the findings it held and deleted it.
#
# A rule decided against is disabled in pyproject.toml and said so; a finding
# the code cannot avoid is disabled inline, on that def or class, with its
# reason. ETB-ANA-001 §6.13 records how the baseline was cleared.

name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pylint:
    name: pylint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # pylint resolves imports, so the package and its extras have to be
      # installed or half the findings would be import errors. The versions,
      # pylint's among them, are pinned in constraints/lint.txt (#282); the
      # pylint pin itself is stated in constraints/lint.in.
      - name: Install
        run: pip install --quiet -c constraints/lint.txt -e .[test] pylint

      - name: Run pylint against the baseline
        run: python scripts/lint.py
