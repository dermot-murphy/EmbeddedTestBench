# Dependabot version updates (#203).
#
# The workflows had drifted several major versions behind before anyone looked
# (#203). This makes the drift arrive as a pull request each week instead.
#
# Every update targets develop, like any other change (CLAUDE.md, gitflow).
# A Dependabot pull request is a proposal, not a decision: it is reviewed and
# merged like any other, and a version that breaks the build is pinned away
# from with the reason recorded (ETB-ACQ4-001). CStyleCheck in particular is
# pinned to an exact tag on purpose - see ETB-ACQ4-001 §7 - and moving it means
# regenerating .cstylecheck-baseline.json in the same change.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels:
      - process
    ignore:
      # CStyleCheck v1.6.0's action fails on every run: it writes its startup
      # banner into the --log file that the action then parses as JSON
      # ("could not read results JSON"), whatever the firmware contains.
      # Reported as dermot-murphy/CStyleCheck#439; #222 declined for it. The
      # pin stays at v1.5.1 (#203, ETB-ACQ4-001 §7). Remove this entry when a
      # release with the fix appears, and move the pin then, regenerating
      # .cstylecheck-baseline.json in the same change (#229).
      - dependency-name: dermot-murphy/CStyleCheck
        versions:
          - "1.6.0"

  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # pyproject.toml states lower bounds for a library that supports Python
    # 3.8. Raising a bound to the newest release proposed versions that the
    # older supported Pythons cannot install (#219, #223, #224). Change a
    # requirement only when its range excludes a new release (#228).
    versioning-strategy: increase-if-necessary
    labels:
      - process
