# QS-07 - Sub-GHz link, on hardware (ETB-SYS5-001, #176).
#
# Programme the S2-LP from a register file and read every register back; write
# a register and read it back; transmit a packet; receive a frame from the
# Kepler sensor after resetting it over BLE. All traffic is logged as rf_packet
# records in the event log, which ETB-SYS5-002 checks.
#
# Only the frame's identity is asserted - its type and the sensor that sent it.
# What a Kepler frame carries is the sensor firmware's business and out of the
# bench's scope (#176).
#
# There is one S2-LP kit on the bench, so a transmitted packet has no second
# receiver here: the transmission is shown to complete and to be logged, not
# to arrive (ETB-SYS5-002 records this).
#
#   python -m benchtools run specs/qualification/qs07_subghz_link.yaml --bench benches/bench_pc.yaml

name: QS-07 Sub-GHz link (hardware)
description: >
  Programme and read back the S2-LP's registers, write and read one back,
  transmit a packet, and receive a VERSION frame from sensor 5C1712 after an
  MCU reset over BLE.
requirements: [ETB-SYS2-046, ETB-SYS2-047, ETB-SYS2-084]

parameters:
  receive_setup: configs/s2lp_kepler_433_rx.regs
  sensor_id: "5C1712"
  sensor_address: "D1:8D:3B:4C:19:96"

instruments:
  s2lp: s2lp
  dongle: ble-dongle

teardown:
  - do: dongle.close_link

tests:
  - name: A register file is programmed and every register it names reads back
    requirement: ETB-SYS2-046
    steps:
      - do: s2lp.apply_configuration
        with: {source: {param: receive_setup}, reset: defaults, verify: true}
        expect:
          - {name: registers_checked, measure: checked, minimum: 20}
          - {name: registers_mismatched, measure: mismatches.length, equals: 0}

  - name: Every register can be read
    requirement: ETB-SYS2-046
    steps:
      - do: s2lp.read_all_registers
        expect:
          - {name: registers_read, measure: length, minimum: 100}

  - name: A register is written and reads back, then is restored
    requirement: ETB-SYS2-046
    steps:
      - do: s2lp.read_register
        with: {which: SYNC0}
        save: sync0
        expect:
          - {name: sync0_before, format: "0x{:02X}", minimum: 0, maximum: 255}
      - do: s2lp.write_register
        with: {which: SYNC0, value: 0x5A}
      - do: s2lp.read_register
        with: {which: SYNC0}
        expect:
          - {name: sync0_written, format: "0x{:02X}", equals: 0x5A}
      - do: s2lp.write_register
        with: {which: SYNC0, value: {from: sync0}}
      - do: s2lp.read_register
        with: {which: SYNC0}
        expect:
          - {name: sync0_restored, format: "0x{:02X}", equals: {from: sync0}}

  - name: A packet is transmitted and recorded
    requirement: ETB-SYS2-046
    steps:
      - do: s2lp.transmit
        with: {data: "ETB-SYS5-002 QS-07", note: "qualification transmit"}
        expect:
          - {name: bytes_sent, measure: length, equals: 17}
          - {name: firmware_error_code, measure: error, equals: 0}

  - name: A frame from the sensor is received after a reset over BLE
    requirement: ETB-SYS2-046
    steps:
      # The receive setup again: the transmit set the packet length.
      - do: s2lp.apply_configuration
        with: {source: {param: receive_setup}, reset: defaults, verify: true}
        expect:
          - {name: registers_mismatched, measure: mismatches.length, equals: 0}
      - do: dongle.scan
        with: {duration: 30.0, name: {param: sensor_id}}
      - do: dongle.select
        with: {sensor: {param: sensor_address}}
      - do: dongle.open_link
      - do: dongle.command_expecting_disconnect
        with: {request: ECURESET HARD, timeout: 15.0}
      - do: s2lp.kepler_frame
        with: {frame_type: VERSION, source: {param: sensor_id}, timeout: 60.0}
        expect:
          - {name: frame_type, measure: type, equals: VERSION}
          - {name: frame_sensor_id, measure: sensor_id, equals: {param: sensor_id}}
