          - {name: ble_lowest, measure: minimum, unit: V, nominal: 2.9, tolerance: {param: ble_vs_supply_v}}
          - {name: ble_highest, measure: maximum, unit: V, nominal: 2.9, tolerance: {param: ble_vs_supply_v}}
      - do: s2lp.kepler_samples
        with:
          field: battery_mv
          source: {param: sensor_id}
          frame_type: ALIVE
          count: {param: alive_readings}
          timeout: 60.0
          scale: 0.001
          unit: V
        expect:
          - {name: alive_frames, measure: count, equals: {param: alive_readings}}
          - name: alive_lowest_from_ble
            measure: minimum
            unit: V
            equals: {from: ble.mean}
            tolerance: {param: alive_vs_ble_v}
          - name: alive_highest_from_ble
            measure: maximum
            unit: V
            equals: {from: ble.mean}
            tolerance: {param: alive_vs_ble_v}

  - name: At 2.8 V the sensor reads the supply, and the ALIVE frame carries it
    requirement: PSU-FR-023, BLE-FR-117, S2LP-FR-072
    steps:
      - do: psu.set_voltage
        with: {channel: {param: supply_channel}, volts: 2.8}
      - do: sleep
        with: {seconds: {param: settle_s}}
      - do: psu.read_channel
        with: {channel: {param: supply_channel}}
        expect:
          - {name: supply_regulated, measure: regulated, equals: 1}
      - do: psu.read_channel
        with: {channel: {param: off_channel}}
        expect:
          - {name: channel_1_off, measure: voltage, unit: V, max: {param: off_max_v}}
      - do: dongle.sample_command
        with:
          request: RD BATTERY
          pattern: '= (\d+)mV'
