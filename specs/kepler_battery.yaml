          - {name: ble_lowest, measure: minimum, unit: V, nominal: 2.8, tolerance: {param: ble_vs_supply_v}}
          - {name: ble_highest, measure: maximum, unit: V, nominal: 2.8, tolerance: {param: ble_vs_supply_v}}
      - do: s2lp.kepler_samples
        with:
          field: battery_mv
          source: {param: sensor_id}
          frame_type: ALIVE
          count: {param: alive_readings}
          timeout: 60.0
          scale: 0.001
          unit: V
        expect:
          - {name: alive_frames, measure: count, equals: {param: alive_readings}}
          - name: alive_lowest_from_ble
            measure: minimum
            unit: V
            equals: {from: ble.mean}
            tolerance: {param: alive_vs_ble_v}
          - name: alive_highest_from_ble
            measure: maximum
            unit: V
            equals: {from: ble.mean}
            tolerance: {param: alive_vs_ble_v}

teardown:
  # The supply first: the sensor should be at its normal voltage for whatever
  # follows, even if the BLE link has gone. Channel 1 stays off.
  - do: psu.set_voltage
    with: {channel: {param: supply_channel}, volts: {param: supply_normal_v}}
  - do: dongle.command
    with:
      request: {param: normal_alive_period_s, format: "WR ALIVE-PERIOD {}"}
      timeout: 45.0
  - do: dongle.close_link
