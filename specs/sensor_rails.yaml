# Supply rails for the sensor board, before anything else is believed.
#
# This suite exists to be run *first*. Every other measurement on this bench is
# taken on a board this supply is powering, and a board browning out under its
# own current limit produces timing and radio results that look like product
# defects. Five minutes here saves a day of chasing one.
#
# Against hardware:
#   python -m benchtools run specs/sensor_rails.yaml --bench benches/lab1.yaml
# Without it:
#   python -m benchtools run specs/sensor_rails.yaml --simulate
#
# Note that under --simulate the supply has no load on it, so the current tests
# assert only that nothing is drawn. They are meaningful on the rig.

name: Sensor board supply rails
description: >
  Bring up the 3V3 and 5V rails, confirm each is regulated rather than in
  current limit, and confirm the board draws what it should.
requirements: [SYS-REQ-100, SYS-REQ-101]

instruments:
  psu: gpd2303s

setup:
  # The limit first, always: a rail coming up at a new voltage must never be
  # protected by the previous test's limit, even for a moment.
  - do: psu.configure_channel
    with: {channel: 1, volts: 3.3, current_limit: 0.5}
  - do: psu.configure_channel
    with: {channel: 2, volts: 5.0, current_limit: 1.0}
  - do: psu.all_outputs_on
  - do: sleep
    with: {seconds: 0.5}          # the board's own soft start

tests:
  - name: The 3V3 rail is at 3.3 V
    requirement: SYS-REQ-100
    steps:
      - do: psu.read_channel
        with: {channel: 1}
        expect:
          - name: rail
            measure: voltage
            display_unit: V
            nominal: 3.3
            tolerance_percent: 2.0
          # regulated is the whole test in one line: energised, in constant
          # voltage, and at the setpoint. A rail in CC fails here rather than
          # producing a plausible voltage nobody asked for.
          - name: regulated
            measure: regulated
            equals: 1

  - name: The board draws what it should from 3V3
    requirement: SYS-REQ-100
    steps:
      - do: psu.read_channel
        with: {channel: 1}
        expect:
          - name: current
            measure: current
            scale: 1000.0
            display_unit: mA
            max: 450.0            # below the 500 mA limit, with margin

  - name: The 5V rail is at 5.0 V
    requirement: SYS-REQ-101
    steps:
      - do: psu.read_channel
        with: {channel: 2}
        expect:
          - name: rail
            measure: voltage
            display_unit: V
            nominal: 5.0
            tolerance_percent: 2.0
          - name: regulated
            measure: regulated
            equals: 1

  - name: Neither channel is in current limit
    requirement: SYS-REQ-100, SYS-REQ-101
    steps:
      # A property read: no arguments, taken when the step runs.
      - do: psu.status
        expect:
          - name: output_on
            measure: output
            equals: 1

teardown:
  # Not just "off": this opens the supply's own output switch, which is the
  # only thing on this instrument that genuinely disconnects both rails.
  - do: psu.all_outputs_off
