# --- Paths / files to ignore entirely ---
ignore:
  paths:
    - "third_party/**"
    - "vendor/**"
    - "build/**"
    - "*.pb.c"
  files:
    - "stm32f4xx_hal_*.c"
    - "stm32f4xx_hal_*.h"

# --- Identifier naming constraints ---
# Cross-category rules governing identifier length and character constraints.
# These complement the per-category length limits in variables/functions/etc.
naming:
  # -----------------------------------------------------------------------
  # Min/max identifier length across all categories (ESA-R-7, JSF Rule 45)
  # -----------------------------------------------------------------------
  # Enforces a project-wide minimum and maximum identifier length applied
  # uniformly across variables, functions, macros, and type names.
  # short exempt_names (i, j, k, …) are always allowed as loop counters.
  identifier_length:
    enabled: false          # opt-in; off by default
    severity: warning
    min_length: 3           # ESA-R-7 default; set to 0 to disable min check
    max_length: 31          # JSF Rule 45 default; set to 0 to disable max check
    exempt_names: ["i", "j", "k", "n", "x", "y", "z"]
    check_variables: true
    check_functions: true
    check_macros: true
    check_types: true

  # -----------------------------------------------------------------------
  # No single-character identifiers except conventional loop counters (ESA-R-4)
  # -----------------------------------------------------------------------
  # Single-character names are ambiguous and non-searchable in code review.
  # Identifiers in the exempt list (default: i, j, k, n, x, y, z) are
  # accepted as conventional loop counter abbreviations.
  no_single_char_identifiers:
    enabled: false          # opt-in; off by default
    severity: warning
    exempt: ["i", "j", "k", "n", "x", "y", "z"]

# --- Sign compatibility (cross-file) ---
# Check that unsigned literals (e.g. 100U) are not passed to signed parameters
# and vice-versa, based on function prototypes found in header files.
#
# Type resolution follows typedef chains:
#   typedef signed char int8_t;  -> int8_t is signed
#   typedef int8_t sint8;        -> sint8  is signed
#
# Arguments are classified as:
#   UNSIGNED  : literal with U/u suffix (e.g. 100U, 0xFFU), or (unsigned T) cast
#   SIGNED    : negative literal (-1), or (signed T) cast
#   NEUTRAL   : plain positive integer literal (10, 0xFF) -- allowed for either
#   UNKNOWN   : variable or expression -- skipped conservatively
#
# Only arguments that are definitively SIGNED or UNSIGNED and conflict with
# the parameter's resolved signedness generate a violation.
sign_compatibility:
  enabled: true
  severity: error
  # Whether to treat plain 'char' (without signed/unsigned keyword) as signed.
  # Most embedded compilers default to signed char; set false if your toolchain
  # defaults to unsigned char.
  plain_char_is_signed: true
