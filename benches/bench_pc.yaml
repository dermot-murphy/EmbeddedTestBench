# The Windows bench PC, as qualified on 2026-10-04 (#176, ETB-SYS5-002).
#
# lab1.yaml is the example to copy; this is the copy for the bench that
# exists. Ports were read from the USB serial numbers on that date:
#
#   COM10  Nordic PCA10059 dongle            D7FA0F34C85A
#   COM11  GPD-3303D, FTDI adapter           A105X5XCA   (supply SN GER916893)
#   COM13  TTi 1604, FTDI FT232 converter    A9LQ0R81A
#   COM14  PICO2 Test Board (Pico 2)         AC5483CD0798FB0B
#   COM4   S2-LP kit, ST-LINK VCP            066CFF515055657867182645
#   USB    J-Link OB-SAM3U128-V2-NordicSem   682395790, on sensor 5C1712
#   USB    PicoScope 3405D MSO               HT415/0202 (added 2026-11-13, #200)
#   COM5   Nordic PPK2 (Power Profiler Kit II) D527E1DA8DBA (added 2026-11-14, #342)
#
# The PicoScope is the bench's oscilloscope (pscope). The Tektronix TDS3014B
# driver has no unit on this bench, so there is no `scope` entry: a
# specification written for the TDS3014B stops at connect and names it
# (ETB-SYS2-011).
name: Bench PC (Windows)
description: >
  Dongle, S2-LP kit, GPD-3303D, TTi 1604, PICO2 Test Board, a PicoScope 3405D
  MSO, a Nordic PPK2 and a J-Link on Kepler sensor 5C1712.

instruments:
  probe:
    driver: jlink
    resource: jlink://
    timeout: 30.0
    options:
      device: nRF52840_xxAA
      speed_khz: 4000
      core_clock_hz: 64000000
      # A user-local install on this bench PC, not on PATH (see
      # docs/jlink/JLink_Integration_Notes.md). Another machine needs its own.
      gdb_executable: &gdb C:/Users/dermot.murphy/tools/arm-gnu-toolchain-14.2/bin/arm-none-eabi-gdb.exe

  rtt:
    driver: jlink-rtt
    resource: jlink://127.0.0.1:2341
    timeout: 30.0
    event: RTT
    options:
      device: nRF52840_xxAA
      speed_khz: 4000
      rtt_port: 19031
      gdb_executable: *gdb   # the probe's; jlink-rtt needs it to start, and never attaches

  dongle:
    driver: ble-dongle
    resource: COM10
    timeout: 10.0

  psu:
    driver: gpd3303d
    resource: COM11
    timeout: 5.0
    options:
      baudrate: 9600
      command_interval: 0.05

  s2lp:
    driver: s2lp
    resource: COM4
    timeout: 5.0
    options:
      board: STEVAL-FKI433V2

  dmm:
    driver: tti1604
    resource: COM13
    timeout: 5.0

  pico2:
    driver: pico2-test-board
    resource: COM14
    timeout: 5.0
    event: TEMP

  # PicoScope 3405D MSO on USB: four analogue channels, 16 digital inputs and a
  # signal generator (#200). Opened by serial number, so a second PicoScope on
  # the PC is never taken by mistake. The ps3000a library is found in the
  # PicoScope 7 installation; name its folder with sdk_path if it moves.
  # Wiring (owner, 2026-11-13): channel A is the PICO2 Test Board's generator
  # channel 1, the UDA1334A's left output. B, C, D and the digital inputs are
  # not connected. What the scope's own generator output drives is not stated.
  pscope:
    driver: picoscope3000
    resource: pico://HT415/0202
    timeout: 10.0
    event: PSCOPE

  # Nordic Power Profiler Kit II on USB (#342): current from under a microamp
  # to about 1 A, 100 000 samples a second, with logic inputs D0-D7. Opened by
  # USB serial number, so the port it lands on does not matter. Connecting
  # changes nothing on the kit; a specification switches the mode, voltage and
  # DUT power itself. voltage_limit caps the voltage the driver will set or
  # power a source-mode kit on at; 3.3 V is the top of a Kepler sensor's supply.
  # What its DUT port and logic inputs are wired to is not yet recorded.
  ppk:
    driver: ppk2
    resource: ppk2://D527E1DA8DBA
    timeout: 5.0
    event: PPK
    options:
      voltage_limit: 3.3
