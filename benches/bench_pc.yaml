# The Windows bench PC, as qualified on 2026-10-04 (#176, ETB-SYS5-002).
#
# lab1.yaml is the example to copy; this is the copy for the bench that
# exists. Ports were read from the USB serial numbers on that date:
#
#   COM10  Nordic PCA10059 dongle            D7FA0F34C85A
#   COM11  GPD-3303D, FTDI adapter           A105X5XCA   (supply SN GER916893)
#   COM13  TTi 1604, FTDI FT232 converter    A9LQ0R81A
#   COM14  Raspberry Pi Pico 2 thermometer   AC5483CD0798FB0B
#   COM4   S2-LP kit, ST-LINK VCP            066CFF515055657867182645
#   USB    J-Link OB-SAM3U128-V2-NordicSem   682395790, on sensor 5C1712
#
# There is no oscilloscope on this bench yet, so there is no scope entry: a
# specification that wants one stops at connect and names it (ETB-SYS2-011).
name: Bench PC (Windows)
description: >
  Dongle, S2-LP kit, GPD-3303D, TTi 1604, Pico 2 thermometer and a J-Link on
  Kepler sensor 5C1712. No oscilloscope.

instruments:
  probe:
    driver: jlink
    resource: jlink://
    timeout: 30.0
    options:
      device: nRF52840_xxAA
      speed_khz: 4000
      core_clock_hz: 64000000
      # A user-local install, not on PATH (see docs/jlink/JLink_Integration_Notes.md).
      gdb_executable: C:/Users/dermot.murphy/tools/arm-gnu-toolchain-14.2/bin/arm-none-eabi-gdb.exe

  rtt:
    driver: jlink-rtt
    resource: jlink://127.0.0.1:2341
    timeout: 30.0
    event: RTT
    options:
      device: nRF52840_xxAA
      speed_khz: 4000
      rtt_port: 19031

  dongle:
    driver: ble-dongle
    resource: COM10
    timeout: 10.0

  psu:
    driver: gpd3303d
    resource: COM11
    timeout: 5.0
    options:
      baudrate: 9600
      command_interval: 0.05

  s2lp:
    driver: s2lp
    resource: COM4
    timeout: 5.0
    options:
      board: STEVAL-FKI433V2

  dmm:
    driver: tti1604
    resource: COM13
    timeout: 5.0

  temp:
    driver: pico-sht30
    resource: COM14
    timeout: 5.0
    event: TEMP
