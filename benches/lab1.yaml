# Example configuration for a real bench. Addresses are site-specific:
# copy this file and change them.
#
# No VISA installation is needed for the oscilloscope, and no vendor Python
# package for the probe. See docs/tek3014b/VISA_Determination_Report.md.
name: Lab bench 1
description: Sensor board test rig - oscilloscope, debug probe and a supply.

instruments:
  scope:
    driver: tek3014b
    resource: 192.168.1.50        # or vxi11://192.168.1.50/gpib0,1
    timeout: 15.0

  # SEGGER J-Link. 'jlink://' spawns a local GDB Server; give a host to attach
  # to one already running elsewhere, which is how a containerised bench reaches
  # a probe plugged into another machine:
  #     resource: jlink://192.168.1.9:2331
  probe:
    driver: jlink
    resource: jlink://
    timeout: 30.0
    options:
      device: nRF52840_xxAA       # required to start a GDB Server
      elf: build/app.elf          # symbols, for variables and call stacks
      core_clock_hz: 64000000     # wrong here makes every cycle timing wrong
      speed_khz: 4000

  # Nordic BLE dongle running firmware/nordic_dongle. A bare port name is read
  # as a serial port, so 'COM5' and '/dev/ttyACM0' both work; a port published
  # over TCP lets a containerised bench reach a dongle on another machine:
  #     resource: serial://socket://bench-pc:4001
  dongle:
    driver: ble-dongle
    resource: /dev/ttyACM0        # COM5 on Windows
    timeout: 10.0
    options:
      # The build this dongle should be running. The driver compares the
      # version *and* the build date against what the dongle reports, so a
      # rebuild of the same version is still a mismatch - which is the case
      # that matters during development.
      firmware: firmware/nordic_dongle/_build
      # true lets the driver flash it when it is out of date. Off here: on a
      # bench whose results are evidence, someone should decide to reflash.
      update_firmware: false

  # Any instrument without a dedicated driver yet can still be addressed,
  # identified and sent raw SCPI through the generic driver.
  psu:
    driver: generic
    resource: 192.168.1.60
